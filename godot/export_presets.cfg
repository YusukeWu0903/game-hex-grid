[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,data/maps/*.json,assets/fonts/OFL.txt"
exclude_filter="tests/*,tools/*,docs/*,user_data/*,data/tables/*,*.bak,*.md,*.ps1,*.cmd"
export_path=""
script_export_mode=2

[preset.0.options]
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
html/head_include="<meta name=\"description\" content=\"Hex Tactics Godot 六角戰棋：四職業、編隊、劇情、寶箱任務與回合回溯。\">"

[preset.1]
name="Windows Desktop"
platform="Windows Desktop"
runnable=false
export_filter="all_resources"
include_filter="data/*.json,data/maps/*.json,assets/fonts/OFL.txt"
exclude_filter="tests/*,tools/*,docs/*,user_data/*,data/tables/*,*.bak,*.md,*.ps1,*.cmd"
export_path=""
script_export_mode=2

[preset.1.options]
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/modify_resources=false
application/export_console_wrapper=0
texture_format/bptc=false
texture_format/s3tc=true
