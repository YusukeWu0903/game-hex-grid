<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六角格戰棋遊戲 - 關卡與地圖編輯器</title>
  </head>
  <body>
    <!-- 1. 主選單 (Main Menu) -->
    <div id="main-menu" class="overlay-screen">
      <div class="menu-container">
        <h1>⚔️ HEX TACTICS RPG</h1>
        <p>六角格戰棋遊戲與關卡編輯器原型</p>
        <div class="menu-buttons">
          <button id="btn-start-game" class="menu-btn primary">🎮 開始遊戲 (Game)</button>
          <button id="btn-open-editor" class="menu-btn secondary">🛠️ 關卡編輯器 (Level Editor)</button>
        </div>
      </div>
    </div>

    <!-- 2. 關卡編輯器面板 (Level Editor Panel) - 頂層入口 -->
    <div id="level-editor-panel" class="floating-panel" style="display: none;">
      <div class="panel-header">
        <span>📋 關卡編輯器</span>
        <button id="btn-level-back-menu" class="action-btn">🏠 返回主選單</button>
      </div>
      <div class="form-group">
        <label>關卡名稱</label>
        <input type="text" id="input-level-name" value="關卡 1：遭遇戰" class="panel-input" />
      </div>
      <div class="form-group">
        <label>綁定地圖 (Map)</label>
        <select id="select-map-bind" class="panel-select">
          <!-- 動態載入已儲存的地圖 -->
        </select>
      </div>

      <!-- 我方出戰單位表 -->
      <div class="panel-section-title">我方出戰單位 (Player Roster)</div>
      <div id="player-roster-list" class="roster-list-container">
        <!-- 動態產生 -->
      </div>
      <button id="btn-add-player-unit" class="io-btn" style="margin-bottom: 6px; width: 100%;">+ 新增我方單位</button>

      <!-- 敵方出戰單位表 -->
      <div class="panel-section-title">敵方出戰單位 (Enemy Roster)</div>
      <div id="enemy-roster-list" class="roster-list-container">
        <!-- 動態產生 -->
      </div>
      <button id="btn-add-enemy-unit" class="io-btn" style="margin-bottom: 8px; width: 100%;">+ 新增敵方單位</button>

      <div class="form-group">
        <label>勝利條件</label>
        <select id="select-win-cond" class="panel-select">
          <option value="ANNIHILATION">敵方全滅 (Annihilation)</option>
          <option value="SURVIVE">生存回合 (Survive)</option>
        </select>
      </div>
      <div class="form-group">
        <label>失敗條件</label>
        <select id="select-lose-cond" class="panel-select">
          <option value="PLAYER_DEATH">我方全滅 (Player Death)</option>
          <option value="TURN_LIMIT">回合超限 (Turn Limit)</option>
        </select>
      </div>
      <div class="panel-actions">
        <button id="btn-edit-map" class="io-btn primary-io">🎨 編輯此地圖 (Map Editor)</button>
        <button id="btn-test-level" class="io-btn">🚀 測試執行關卡</button>
      </div>
    </div>

    <!-- 3. 地圖編輯器面板 (Map Editor Panel) - 子模組 -->
    <div id="map-editor-panel" class="floating-panel" style="display: none;">
      <div class="panel-header">
        <span>🗺️ 地圖編輯器 (<span id="editing-map-name"></span>)</span>
        <button id="btn-back-level-editor" class="action-btn">↩️ 儲存並返回</button>
      </div>
      <div class="panel-section-title">地形筆刷</div>
      <div class="brush-group" id="brush-group">
        <button class="brush-btn active" data-terrain="PLAIN">平地</button>
        <button class="brush-btn" data-terrain="FOREST">森林</button>
        <button class="brush-btn" data-terrain="MOUNTAIN">山脈</button>
        <button class="brush-btn" data-terrain="SWAMP">沼澤</button>
        <button class="brush-btn" data-terrain="HILLS">丘陵</button>
        <button class="brush-btn" data-terrain="WATER">水域</button>
      </div>
      <div class="panel-section-title">佈署點筆刷</div>
      <div class="brush-group" id="spawn-brush-group">
        <button class="brush-btn spawn-p" data-spawn="PLAYER">🚩 我方 (P)</button>
        <button class="brush-btn spawn-e" data-spawn="ENEMY">💀 敵方 (E)</button>
        <button class="brush-btn spawn-clear" data-spawn="CLEAR">🧹 清除</button>
      </div>
      <div class="io-group">
        <button id="btn-export" class="io-btn">📤 匯出</button>
        <button id="btn-import" class="io-btn">📥 匯入</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" />
      </div>
    </div>

    <!-- 4. 遊戲進行中 HUD 控制面板 -->
    <div id="game-panel" class="floating-panel game-hud-panel" style="display: none;">
      <div class="panel-header">
        <span>🎮 戰鬥進行中</span>
        <button id="btn-game-back" class="action-btn">🏠 放棄</button>
      </div>
    </div>

    <!-- 回合切換過場動畫橫幅 -->
    <div id="turn-banner"></div>

    <!-- 遊戲畫布 -->
    <canvas id="gameCanvas"></canvas>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
  <style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #080b10;
        font-family: Consolas, monospace, sans-serif;
    }
    #gameCanvas {
        display: block;
    }

    /* 回合切換過場動畫橫幅 */
    #turn-banner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 18px 48px;
        font-size: 2.2rem;
        font-weight: bold;
        font-family: Consolas, monospace, sans-serif;
        letter-spacing: 4px;
        background: rgba(8, 11, 16, 0.88);
        border: 2px solid #38bdf8;
        border-radius: 14px;
        color: #38bdf8;
        opacity: 0;
        pointer-events: none;
        z-index: 500;
        text-shadow: 0 0 18px currentColor;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.7), 0 0 24px currentColor;
        transition: opacity 0.3s ease;
    }
    #turn-banner.show {
        animation: bannerInOut 2s ease forwards;
    }
    @keyframes bannerInOut {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
        12%  { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        22%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        85%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    /* 主選單全螢幕畫面 */
    .overlay-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, #1e293b 0%, #080b10 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    .menu-container {
        text-align: center;
        color: #f8fafc;
        padding: 40px 60px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid #334155;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
    .menu-container h1 {
        color: #f8fafc;
        margin-bottom: 10px;
        font-size: 2.2rem;
        letter-spacing: 2px;
    }
    .menu-container p {
        color: #94a3b8;
        margin-bottom: 30px;
        font-size: 1rem;
    }
    .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .menu-btn {
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        font-family: inherit;
    }
    .menu-btn.primary {
        background: #0284c7;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }
    .menu-btn.primary:hover {
        background: #0369a1;
        transform: translateY(-2px);
    }
    .menu-btn.secondary {
        background: #334155;
        color: #f8fafc;
    }
    .menu-btn.secondary:hover {
        background: #475569;
        transform: translateY(-2px);
    }

    /* 浮動控制面板基礎樣式 */
    .floating-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 250px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        background: rgba(15, 23, 42, 0.92);
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #334155;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        width: 100%;
        color: #cbd5e1;
        font-size: 13px;
        font-weight: bold;
        align-items: center;
        border-bottom: 1px solid #1e293b;
        padding-bottom: 6px;
    }
    .action-btn {
        background: #475569;
        color: #f8fafc;
        border: none;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
    }
    .action-btn:hover {
        background: #64748b;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        font-size: 11px;
        color: #94a3b8;
    }
    .form-group label {
        font-weight: bold;
    }
    .panel-input, .panel-select {
        background: #1e293b;
        border: 1px solid #475569;
        color: #f8fafc;
        padding: 6px 8px;
        border-radius: 6px;
        font-family: inherit;
        font-size: 12px;
        width: 100%;
        box-sizing: border-box;
    }
    .panel-section-title {
        font-size: 11px;
        color: #38bdf8;
        font-weight: bold;
        margin-top: 4px;
    }
    .roster-list-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        max-height: 110px;
        overflow-y: auto;
    }
    .roster-item {
        display: flex;
        gap: 6px;
        align-items: center;
        width: 100%;
    }
    .roster-item select {
        flex: 1;
        padding: 4px;
        background: #1e293b;
        color: #fff;
        border: 1px solid #475569;
        border-radius: 4px;
        font-size: 11px;
        font-family: inherit;
    }
    .roster-del-btn {
        background: #ef4444;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 4px 6px;
        cursor: pointer;
        font-size: 10px;
    }
    .brush-group {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        width: 100%;
    }
    .brush-btn {
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #475569;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 11px;
        transition: all 0.2s;
        text-align: center;
    }
    .brush-btn:hover {
        background: #334155;
        color: #f8fafc;
    }
    .brush-btn.active {
        background: #0284c7;
        color: #ffffff;
        border-color: #38bdf8;
    }
    .brush-btn.spawn-p.active {
        background: #0369a1;
        border-color: #38bdf8;
    }
    .brush-btn.spawn-e.active {
        background: #b91c1c;
        border-color: #f87171;
    }
    .brush-btn.spawn-clear.active {
        background: #475569;
        border-color: #94a3b8;
    }
    .io-group {
        display: flex;
        gap: 8px;
        width: 100%;
        justify-content: center;
        border-top: 1px solid #1e293b;
        padding-top: 8px;
        margin-top: 4px;
    }
    .io-btn {
        background: #0f172a;
        color: #38bdf8;
        border: 1px solid #0284c7;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        text-align: center;
    }
    .io-btn:hover {
        background: #0284c7;
        color: #fff;
    }
    .io-btn.primary-io {
        background: #0284c7;
        color: #fff;
    }
    .io-btn.primary-io:hover {
        background: #0369a1;
    }
    .panel-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        margin-top: 6px;
    }
  </style>
</html>
